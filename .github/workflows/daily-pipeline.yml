name: Daily pipeline

# Runs the same steps as the Airflow DAG on a GitHub-hosted runner, so the data
# keeps flowing when no Airflow instance is up. Raw partitions persist in the
# Actions cache; the warehouse is rebuilt from them on every run. The aggregate
# marts are published to the `marts-data` branch for a hosted dashboard.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Re-pull every raw partition
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e . -c constraints.txt

      - name: Restore raw partitions
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: lvm-raw-${{ github.run_id }}
          restore-keys: lvm-raw-

      - name: Extract
        run: lvm extract ${{ inputs.full_refresh && '--full-refresh' || '' }}

      # Saved straight after the extract so a later failure never costs a re-download.
      - name: Save raw partitions
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: lvm-raw-${{ github.run_id }}

      - name: Source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Export marts
        run: lvm export

      - name: Publish marts
        run: scripts/publish_marts.sh marts-data origin

      - name: Upload dbt artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/target/sources.json
          retention-days: 14

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lt-vehicle-market"
version = "0.3.0"
description = "ELT pipeline over Lithuanian open data on vehicle transactions and technical inspections: API -> Parquet -> DuckDB -> dbt -> Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ismayil Sultanli" }]
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "httpx>=0.27",
    "fsspec>=2024.6",
    "tenacity>=8.2",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]
dashboard = ["streamlit>=1.39", "plotly>=5.24", "pandas>=2.2", "pyarrow>=17"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "s3fs>=2024.6",
    "moto[server]>=5",
]
figures = ["matplotlib>=3.9", "pandas>=2.2", "pyarrow>=17"]

[project.scripts]
lvm = "lt_vehicle_market.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lt_vehicle_market"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dashboard", "airflow", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lt_vehicle_market --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "fsspec.*", "s3fs.*"]
ignore_missing_imports = true
